name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    # Fail fast on things CLAUDE.md says are never committed or written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block forbidden files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(data|runs)/|(^|/)\.env(\..*)?$|\.(ckpt|safetensors|pt)$|settings\.local\.json$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
      - name: Block notebook outputs
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          bad = [f for f in subprocess.check_output(["git", "ls-files", "*.ipynb"], text=True).split()
                 if any(c.get("outputs") for c in json.load(open(f)).get("cells", []))]
          if bad:
              print("Notebooks with outputs:", *bad, sep=chr(10))
              sys.exit(1)
          PY
      - name: Block AI credit lines
        # Commit messages and PR text; the squash commit body comes from the PR text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$HEAD_SHA" ]; then
            text=$(git log --format=%B "$BASE_SHA..$HEAD_SHA"; printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY")
          else
            text=$(git log -1 --format=%B)
          fi
          if printf '%s' "$text" | grep -iE 'co-authored-by:[[:space:]]*claude|generated with \[?claude|noreply@anthropic\.com'; then
            echo "Remove the AI credit lines above (see Git section of .claude/CLAUDE.md)."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not slow" -q
