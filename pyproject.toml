[project]
name = "herdmind"
version = "0.1.0"
description = "Predator-prey simulation driven by interchangeable decision models (rules, Jev, distilled Decider)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than 5 s; excluded from the fast suite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
