[project]
name = "herdmind"
version = "0.1.0"
description = "Predator-prey simulation driven by interchangeable decision models (rules, Jev, distilled Decider)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "mesa>=3.3.1",
    "numpy>=1.26",
    "omegaconf>=2.4.0",
    "pyarrow>=17",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Fine-tuning only (items 20 and 26). Worlds and the fast tests do not need it;
# install on the GPU machine with `pip install -e ".[train]"`.
train = ["decider-ai>=1.10", "peft>=0.13", "torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than 5 s; excluded from the fast suite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Smoke scripts hold long sample payloads; keep the limit for src/ and tests/.
"scripts/**" = ["E501"]
