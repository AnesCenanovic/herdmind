:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--line:#d0d0d0;--head:#f2f2f2;--done:#eef6ee;--ready:#1a7f37;--wait:#9a6700;--link:#0b57d0}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#e6e6e6;--muted:#9a9a9a;--line:#3a3a3a;--head:#222;--done:#18261b;--ready:#56c271;--wait:#d6a33a;--link:#8ab4f8;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:12px 0}
.bar label{display:flex;gap:6px;align-items:center}
#msg{color:var(--muted);min-height:1.4em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--head);font-weight:600;white-space:nowrap}
td.num,td.deps,td.bundle{white-space:nowrap}
tr.done td{background:var(--done)}
tr.done td.title{color:var(--muted)}
.note{display:block;color:var(--muted);font-size:12px}
.ready{color:var(--ready);font-weight:600}
.wait{color:var(--wait)}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
button{cursor:pointer}
input.who{width:110px}
</style>
</head>

<script>
(function () {
  var STATUS = {open: "Open", progress: "In progress", review: "In review", done: "Done"};
  var base = JSON.parse(document.getElementById("data").textContent);
  var KEY = "herdmind-backlog:" + location.pathname;
  var items = JSON.parse(JSON.stringify(base));
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (saved) items.forEach(function (it) { if (saved[it.id]) Object.assign(it, saved[it.id]); });

  var f = {hide: false, ready: false, type: ""};
  function $(id) { return document.getElementById(id); }
  function msg(t) { $("msg").textContent = t || ""; }
  function td(text, cls) { var c = document.createElement("td"); if (cls) c.className = cls; if (text != null) c.textContent = text; return c; }

  function persist() {
    var m = {};
    items.forEach(function (it) { m[it.id] = {assignee: it.assignee, status: it.status}; });
    try { localStorage.setItem(KEY, JSON.stringify(m)); msg("Saved in this browser."); }
    catch (e) { msg("This browser won't keep changes here; use Save as file."); }
  }

  function render() {
    var byId = {};
    items.forEach(function (i) { byId[i.id] = i; });
    var isDone = function (d) { return byId[d] && byId[d].status === "done"; };
    var tb = $("rows"); tb.textContent = "";
    var shown = 0;
    items.forEach(function (it) {
      var ready = it.deps.every(isDone);
      if (f.hide && it.status === "done") return;
      if (f.ready && (!ready || it.status === "done")) return;
      if (f.type && it.type !== f.type) return;
      shown++;
      var tr = document.createElement("tr");
      if (it.status === "done") tr.className = "done";
      tr.appendChild(td(it.label, "num"));
      var t = td(it.title, "title");
      if (it.note) { var n = document.createElement("span"); n.className = "note"; n.textContent = it.note; t.appendChild(n); }
      tr.appendChild(t);
      tr.appendChild(td(it.type));
      tr.appendChild(td(it.deps.length ? it.deps.join(", ") : "\u2014", "deps"));
      tr.appendChild(td(it.bundle || "\u2014", "bundle"));
      var r = td("");
      if (it.status !== "done") {
        if (ready) { r.textContent = "Ready"; r.className = "ready"; }
        else { r.textContent = "Waiting on " + it.deps.filter(function (d) { return !isDone(d); }).join(", "); r.className = "wait"; }
      }
      tr.appendChild(r);
      var a = td(null), inp = document.createElement("input");
      inp.className = "who"; inp.value = it.assignee || ""; inp.placeholder = "Name";
      inp.setAttribute("aria-label", "Assignee for item " + it.label);
      inp.addEventListener("change", function () { it.assignee = inp.value.trim(); persist(); });
      a.appendChild(inp); tr.appendChild(a);
      var s = td(null), sel = document.createElement("select");
      sel.setAttribute("aria-label", "Status of item " + it.label);
      Object.keys(STATUS).forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = STATUS[k]; sel.appendChild(o); });
      sel.value = it.status;
      sel.addEventListener("change", function () { it.status = sel.value; persist(); render(); });
      s.appendChild(sel); tr.appendChild(s);
      tb.appendChild(tr);
    });
    if (!shown) { var tr2 = document.createElement("tr"), c = td("Nothing matches these filters."); c.colSpan = 8; tr2.appendChild(c); tb.appendChild(tr2); }
    var open = items.filter(function (i) { return i.status !== "done"; }).length;
    $("count").textContent = (items.length - open) + " done \u00b7 " + open + " open";
  }

  $("hide-done").addEventListener("change", function (e) { f.hide = e.target.checked; render(); });
  $("only-ready").addEventListener("change", function (e) { f.ready = e.target.checked; render(); });
  $("type-filter").addEventListener("change", function (e) { f.type = e.target.value; render(); });

  $("save").addEventListener("click", function () {
    var json = JSON.stringify(items, null, 1).replace(/<\//g, "<\\/");
    var doc = "<!doctype html>\n" + document.documentElement.outerHTML;
    var start = doc.indexOf('<script type="application/json" id="data">');
    var end = doc.indexOf("</" + "script>", start);
    doc = doc.slice(0, start) + '<script type="application/json" id="data">\n' + json + "\n" + doc.slice(end);
    doc = doc.replace(/<tbody id="rows">[\s\S]*?<\/tbody>/, '<tbody id="rows"></tbody>');
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([doc], {type: "text/html"}));
    a.download = "herdmind-backlog.html";
    document.body.appendChild(a); a.click(); a.remove();
    msg("Downloaded herdmind-backlog.html with current statuses.");
  });

  $("reset").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    items = JSON.parse(JSON.stringify(base));
    render(); msg("Back to the statuses stored in the file.");
  });

  render();
})();
</script>
